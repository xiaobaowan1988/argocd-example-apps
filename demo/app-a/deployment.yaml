apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: app-a}
  template:
    metadata:
      labels: {app: app-a}
    spec:
      containers:
        - name: app-a
          image: mirror.gcr.io/library/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
